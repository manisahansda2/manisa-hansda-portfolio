# Render Blueprint — free static site
# https://render.com/docs/blueprint-spec
services:
  - type: web
    name: manisa-hansda-portfolio
    runtime: static
    buildCommand: "true"
    staticPublishPath: .
    pullRequestPreviewsEnabled: true
    headers:
      - path: /*
        name: Cache-Control
        value: public, max-age=0, must-revalidate
